# Overlay for editing the prepared Network prototype without rebuilding code.
# Start with: docker compose -f docker-compose.prepared.yml -f docker-compose.dev.yml up -d editor
services:
  editor:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8123", "--reload", "--reload-dir", "/app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
